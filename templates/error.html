{% extends "base.html" %}
{% block title %}{{ code }} Error{% endblock %}
{% block content %}
<div style="text-align:center;padding:4rem 1rem">
  <div style="font-size:4rem;font-weight:800;color:var(--red)">{{ code }}</div>
  <div style="font-size:1.15rem;color:var(--ink-soft);margin:.5rem 0 1.5rem">{{ message }}</div>
  <a href="{{ url_for('dashboard') }}" class="btn btn-dark">Go to dashboard</a>
</div>
{% endblock %}
